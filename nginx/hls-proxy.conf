server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name prod.example.com;

    ssl_certificate /etc/letsencrypt/live/prod.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The Python gateway is the single public HLS entrypoint.
    # It handles both /<channel>.m3u8 and /s/<token>.ts, while hlsd
    # remains private on 127.0.0.1:8080.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name prod.example.com;

    return 301 https://$host$request_uri;
}
