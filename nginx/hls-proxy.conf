server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name prod.example.com;

    # Replace with your actual certificate paths.
    ssl_certificate /etc/letsencrypt/live/prod.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Channel playlists: /38.m3u8, /100.m3u8, etc.
    location ~ ^/[0-9]+\.m3u8$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # Segment/key resources generated by the gateway.
    location ~ \.(ts|m4s|aac|mp4|key)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve media range semantics.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name prod.example.com;

    return 301 https://$host$request_uri;
}
